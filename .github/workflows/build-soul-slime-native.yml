name: Build Soul Slime Native APK

permissions:
  contents: write

on:
  push:
    branches:
      - 'prototype/soul-slime-v14-exact-mesh'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore validated exact 3D creature assets
        run: |
          mkdir -p soulapp/src/main/assets
          cat soulapp/exact_mesh_payload/razor/part_* | base64 -d > soulapp/src/main/assets/razorbeast.ssm
          cat soulapp/exact_mesh_payload/void/part_* | base64 -d > soulapp/src/main/assets/voidweaver.ssm
          base64 -d soulapp/creature_payload/razorbeast.jpg.b64 > soulapp/src/main/assets/razorbeast.jpg
          base64 -d soulapp/creature_payload/voidweaver.jpg.b64 > soulapp/src/main/assets/voidweaver.jpg
          echo "a9440e652069aa71f591cde0d57e902163351ffdbe293aae60874f6d01f25042  soulapp/src/main/assets/razorbeast.ssm" | sha256sum -c -
          echo "d0643d176ebf04ef06f7f3168806577e46af8abc90cb898e45f7978bc4b83e4e  soulapp/src/main/assets/voidweaver.ssm" | sha256sum -c -
          test -s soulapp/src/main/assets/razorbeast.jpg
          test -s soulapp/src/main/assets/voidweaver.jpg

      - name: Prepare v8 painted room and creature art
        run: |
          python -m pip install --quiet pillow
          python tools/prepare_v8_scene_art.py
          test -s soulapp/src/main/res/drawable-nodpi/slime_master.webp
          test -s soulapp/src/main/res/drawable-nodpi/room_start.webp
          test -s soulapp/src/main/res/drawable-nodpi/room_corridor.webp
          test -s soulapp/src/main/res/drawable-nodpi/room_junction.webp
          test -s soulapp/src/main/res/drawable-nodpi/room_spider.webp
          test -s soulapp/src/main/res/drawable-nodpi/mite_master.webp
          test -s soulapp/src/main/res/drawable-nodpi/spider_master.webp

      - name: Generate supporting cave effects
        run: |
          python tools/generate_soul_slime_anime_art.py
          test -s soulapp/src/main/res/drawable-nodpi/cave_bg.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_mid.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_fg.png
          test -s soulapp/src/main/res/drawable-nodpi/crystal_blue.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_mite.png
          test -s soulapp/src/main/res/drawable-nodpi/anime_spider.png
          test -s soulapp/src/main/res/drawable-nodpi/anime_lizard.png
          test -s soulapp/src/main/res/drawable-nodpi/ancient_dragon.png
          test -s soulapp/src/main/res/drawable-nodpi/essence_orb.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_crossroads.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_web.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_scale.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_dragon.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_dragon_approach.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_chasm.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_vault.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_grotto.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_shard.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_echo.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_crypt.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_obsidian.png

      - name: Compile native Soul Slime
        run: gradle :soulapp:assembleDebug --stacktrace

      - name: Validate APK
        run: |
          APK="soulapp/build/outputs/apk/debug/soulapp-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 4
          cp "$APK" SoulSlime-v14-Exact-Mite-Voidweaver.apk
          zip -q SoulSlime-v14-Exact-Mite-Voidweaver-APK.zip SoulSlime-v14-Exact-Mite-Voidweaver.apk
          zip -qr SoulSlime-v14-Exact-Mite-Voidweaver-source.zip soulapp settings.gradle.kts build.gradle.kts tools/fbx_to_ssm2_exact.py
          unzip -t SoulSlime-v14-Exact-Mite-Voidweaver-APK.zip >/dev/null
          ls -lh SoulSlime-v14-Exact-Mite-Voidweaver.apk SoulSlime-v14-Exact-Mite-Voidweaver-APK.zip SoulSlime-v14-Exact-Mite-Voidweaver-source.zip
          sha256sum SoulSlime-v14-Exact-Mite-Voidweaver.apk SoulSlime-v14-Exact-Mite-Voidweaver-APK.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SoulSlime-v14-Exact-Mite-Voidweaver
          path: |
            SoulSlime-v14-Exact-Mite-Voidweaver.apk
            SoulSlime-v14-Exact-Mite-Voidweaver-APK.zip
            SoulSlime-v14-Exact-Mite-Voidweaver-source.zip

      - name: Publish permanent Soul Slime test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view soul-slime-native-v14-exact-mesh >/dev/null 2>&1 || \
            gh release create soul-slime-native-v14-exact-mesh --title "Soul Slime v14 — Exact Mite + Void Weaver Meshes" --notes "Scene-preserving v14 based on the real v10-v13 branch. Uses every original FBX triangle and UV for the Molten Razorbeast and Armored Void Weaver, split only into OpenGL ES 2-safe draw chunks. No clustering, decimation, face deletion, or mesh approximation. Preserves all four painted scenes, collisions, progression, HUD, creator, 3D slime, grounding, lighting, and combat effects." --prerelease --target prototype/soul-slime-v14-exact-mesh
          gh release upload soul-slime-native-v14-exact-mesh SoulSlime-v14-Exact-Mite-Voidweaver.apk SoulSlime-v14-Exact-Mite-Voidweaver-APK.zip SoulSlime-v14-Exact-Mite-Voidweaver-source.zip --clobber

name: Build Soul Slime Native APK

permissions:
  contents: write

on:
  push:
    branches:
      - 'prototype/soul-slime-native'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate anime cave art
        run: |
          python -m pip install --quiet pillow
          python tools/generate_soul_slime_anime_art.py
          test -s soulapp/src/main/res/drawable-nodpi/cave_bg.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_mid.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_fg.png
          test -s soulapp/src/main/res/drawable-nodpi/crystal_blue.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_mite.png
          test -s soulapp/src/main/res/drawable-nodpi/anime_spider.png
          test -s soulapp/src/main/res/drawable-nodpi/anime_lizard.png
          test -s soulapp/src/main/res/drawable-nodpi/ancient_dragon.png
          test -s soulapp/src/main/res/drawable-nodpi/essence_orb.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_crossroads.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_web.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_scale.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_dragon.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_dragon_approach.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_chasm.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_vault.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_grotto.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_shard.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_echo.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_crypt.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_obsidian.png

      - name: Compile native Soul Slime
        run: gradle :soulapp:assembleDebug --stacktrace

      - name: Validate APK
        run: |
          APK="soulapp/build/outputs/apk/debug/soulapp-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 4
          cp "$APK" SoulSlime-Native-v6.apk
          zip -q SoulSlime-Native-v6-APK.zip SoulSlime-Native-v6.apk
          zip -qr SoulSlime-Native-v6-source.zip soulapp settings.gradle.kts build.gradle.kts
          unzip -t SoulSlime-Native-v6-APK.zip >/dev/null
          ls -lh SoulSlime-Native-v6.apk SoulSlime-Native-v6-APK.zip SoulSlime-Native-v6-source.zip
          sha256sum SoulSlime-Native-v6.apk SoulSlime-Native-v6-APK.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SoulSlime-Native-v6
          path: |
            SoulSlime-Native-v6.apk
            SoulSlime-Native-v6-APK.zip
            SoulSlime-Native-v6-source.zip

      - name: Publish permanent Soul Slime test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view soul-slime-native-v6 >/dev/null 2>&1 || \
            gh release create soul-slime-native-v6 --title "Soul Slime Native v6 — Adult Anime Maze" --notes "Adult-anime cave overhaul: analog stick, 16-room looping maze, perspective depth, sharper black/gold/crimson creature art, detailed cave rooms, absorption, morphs, and dragon progression." --prerelease --target prototype/soul-slime-native
          gh release upload soul-slime-native-v6 SoulSlime-Native-v6.apk SoulSlime-Native-v6-APK.zip SoulSlime-Native-v6-source.zip --clobber

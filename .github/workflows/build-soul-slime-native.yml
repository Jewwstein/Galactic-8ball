name: Build Soul Slime Native APK

permissions:
  contents: write

on:
  push:
    branches:
      - 'prototype/soul-slime-v13-spider-fix'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore real 3D creature assets
        run: |
          mkdir -p soulapp/src/main/assets
          base64 -d soulapp/creature_payload/razorbeast.ssm.b64 > soulapp/src/main/assets/razorbeast.ssm
          base64 -d soulapp/creature_payload/voidweaver.ssm.b64 > soulapp/src/main/assets/voidweaver.ssm
          base64 -d soulapp/creature_payload/razorbeast.jpg.b64 > soulapp/src/main/assets/razorbeast.jpg
          base64 -d soulapp/creature_payload/voidweaver.jpg.b64 > soulapp/src/main/assets/voidweaver.jpg
          test -s soulapp/src/main/assets/razorbeast.ssm
          test -s soulapp/src/main/assets/voidweaver.ssm
          test -s soulapp/src/main/assets/razorbeast.jpg
          test -s soulapp/src/main/assets/voidweaver.jpg

      - name: Prepare v8 painted room and creature art
        run: |
          python -m pip install --quiet pillow
          python tools/prepare_v8_scene_art.py
          test -s soulapp/src/main/res/drawable-nodpi/slime_master.webp
          test -s soulapp/src/main/res/drawable-nodpi/room_start.webp
          test -s soulapp/src/main/res/drawable-nodpi/room_corridor.webp
          test -s soulapp/src/main/res/drawable-nodpi/room_junction.webp
          test -s soulapp/src/main/res/drawable-nodpi/room_spider.webp
          test -s soulapp/src/main/res/drawable-nodpi/mite_master.webp
          test -s soulapp/src/main/res/drawable-nodpi/spider_master.webp

      - name: Generate supporting cave effects
        run: |
          python tools/generate_soul_slime_anime_art.py
          test -s soulapp/src/main/res/drawable-nodpi/cave_bg.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_mid.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_fg.png
          test -s soulapp/src/main/res/drawable-nodpi/crystal_blue.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_mite.png
          test -s soulapp/src/main/res/drawable-nodpi/anime_spider.png
          test -s soulapp/src/main/res/drawable-nodpi/anime_lizard.png
          test -s soulapp/src/main/res/drawable-nodpi/ancient_dragon.png
          test -s soulapp/src/main/res/drawable-nodpi/essence_orb.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_crossroads.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_web.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_scale.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_dragon.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_dragon_approach.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_chasm.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_vault.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_grotto.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_shard.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_echo.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_crypt.png
          test -s soulapp/src/main/res/drawable-nodpi/cave_obsidian.png

      - name: Compile native Soul Slime
        run: gradle :soulapp:assembleDebug --stacktrace

      - name: Validate APK
        run: |
          APK="soulapp/build/outputs/apk/debug/soulapp-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 4
          cp "$APK" SoulSlime-v13-Spider-Mesh-Fixed.apk
          zip -q SoulSlime-v13-Spider-Mesh-Fixed-APK.zip SoulSlime-v13-Spider-Mesh-Fixed.apk
          zip -qr SoulSlime-v13-Spider-Mesh-Fixed-source.zip soulapp settings.gradle.kts build.gradle.kts tools/convert_meshy_fbx_mobile.py
          unzip -t SoulSlime-v13-Spider-Mesh-Fixed-APK.zip >/dev/null
          ls -lh SoulSlime-v13-Spider-Mesh-Fixed.apk SoulSlime-v13-Spider-Mesh-Fixed-APK.zip SoulSlime-v13-Spider-Mesh-Fixed-source.zip
          sha256sum SoulSlime-v13-Spider-Mesh-Fixed.apk SoulSlime-v13-Spider-Mesh-Fixed-APK.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SoulSlime-v13-Spider-Mesh-Fixed
          path: |
            SoulSlime-v13-Spider-Mesh-Fixed.apk
            SoulSlime-v13-Spider-Mesh-Fixed-APK.zip
            SoulSlime-v13-Spider-Mesh-Fixed-source.zip

      - name: Publish permanent Soul Slime test download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view soul-slime-native-v13-spider-fix >/dev/null 2>&1 || \
            gh release create soul-slime-native-v13-spider-fix --title "Soul Slime v13 — Spider Mesh + Axis Fix" --notes "Scene-preserving v13 based on the real v10/v12 branch. Rebuilds the Meshy FBX creatures with topology-preserving vertex clustering, fixes the Void Weaver triangle corruption, removes the incorrect extra Y-axis quarter-turn, grounds Z-up creatures to the painted floor, and preserves all four painted scenes, collisions, progression, HUD, creator, 3D slime, lighting, and combat effects." --prerelease --target prototype/soul-slime-v13-spider-fix
          gh release upload soul-slime-native-v13-spider-fix SoulSlime-v13-Spider-Mesh-Fixed.apk SoulSlime-v13-Spider-Mesh-Fixed-APK.zip SoulSlime-v13-Spider-Mesh-Fixed-source.zip --clobber

name: Build Soul Slime HD Creator

on:
  push:
    branches:
      - 'prototype/soul-slime-hd'
  workflow_dispatch:

jobs:
  export_android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          mkdir -p "$HOME/.android"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/.android/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12 || true
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "/usr/local/lib/android/sdk"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Export Soul Slime HD Creator APK
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./soul-slime-hd
          relative_export_path: ./soul-slime-hd-export
          archive_output: false
          export_debug: true
          presets_to_export: Android
          verbose: true
          cache: true

      - name: Collect APK
        run: |
          find . -type f -name '*.apk' -print
          APK=$(find . -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" SoulSlimeHD-Creator-v0.1.apk
          unzip -t SoulSlimeHD-Creator-v0.1.apk >/dev/null
          ls -lh SoulSlimeHD-Creator-v0.1.apk
          sha256sum SoulSlimeHD-Creator-v0.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SoulSlimeHD-Creator-v0.1
          path: SoulSlimeHD-Creator-v0.1.apk

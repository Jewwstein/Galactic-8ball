name: Build Soul Slime Prototype APK

on:
  push:
    branches:
      - 'prototype/soul-slime'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack prototype
        run: |
          rm -rf /tmp/SoulSlimePrototype
          mkdir -p /tmp/SoulSlimePrototype
          unzip -q slime-prototype/SoulSlimePrototype-source.zip -d /tmp/SoulSlimePrototype

      - name: Build debug APK
        working-directory: /tmp/SoulSlimePrototype
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SoulSlimePrototype-debug
          path: /tmp/SoulSlimePrototype/app/build/outputs/apk/debug/app-debug.apk

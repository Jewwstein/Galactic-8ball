name: Little Universe Android Launch Test
on:
  push:
    branches: [little-universe-v1]
    paths: ['.github/workflows/little-universe-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Allow KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Launch keepsake app and capture home screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            gradle -p little-universe :app:assembleDebug --no-daemon
            adb install little-universe/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.littleuniverse.memories.cosmic.family/com.littleuniverse.memories.MainActivity
            sleep 5
            adb shell dumpsys activity activities | grep -F 'com.littleuniverse.memories.cosmic.family'
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/home.png
            adb shell input tap 190 600
            sleep 2
            adb exec-out screencap -p > screenshots/interaction.png
            adb logcat -d -v brief | grep -A 12 -F 'FATAL EXCEPTION' > screenshots/crashes.txt || true
            test ! -s screenshots/crashes.txt
            gradle -p little-universe :app:assembleDebugAndroidTest --no-daemon
            adb install little-universe/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.littleuniverse.memories.cosmic.family.test/androidx.test.runner.AndroidJUnitRunner | tee screenshots/merge-tests.txt
            grep -q "OK (2 tests)" screenshots/merge-tests.txt
      - name: Share emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Little-Universe-v0.3.2-Emulator-Preview
          path: screenshots
          retention-days: 7

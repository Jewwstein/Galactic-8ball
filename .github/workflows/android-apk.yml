name: Build After the Storm APK
on:
  push:
    branches: [hurricane-relief-prototype]
  pull_request:
    branches: [main]
    paths:
      - 'after-the-storm/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: after-the-storm
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android Platform
        run: |
          echo "SDK: ${ANDROID_HOME}"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore CAT 545D model
        run: |
          test -f app/src/main/assets/skidder.zip
          unzip -o app/src/main/assets/skidder.zip -d app/src/main/assets
          test -s app/src/main/assets/skidder.glb
      - name: Build installable APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AfterTheStorm-Android-Prototype
          path: after-the-storm/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
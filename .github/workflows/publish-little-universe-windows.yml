name: Publish Our Little Universe Windows EXE
on:
  push:
    branches: [little-universe-v1]
    paths:
      - '.github/workflows/publish-little-universe-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download previously verified Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41270089631 \
            --repo "$GITHUB_REPOSITORY" \
            --name 'Our-Little-Universe-FamilyRelay-Windows-Portable' \
            --dir windows-build
      - name: Verify executable and SHA-256
        run: |
          set -eu
          EXE="windows-build/Our-Little-Universe-Windows-v0.4.0-FamilyRelay-Portable.exe"
          test -f "$EXE"
          test "$(stat -c %s "$EXE")" -gt 70000000
          sha256sum "$EXE"
          test "$(dd if="$EXE" bs=2 count=1 status=none)" = "MZ"
      - name: Publish permanent direct-download GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="our-little-universe-windows-v0.4.0"
          EXE="windows-build/Our-Little-Universe-Windows-v0.4.0-FamilyRelay-Portable.exe"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$EXE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$EXE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Our Little Universe • Windows Family Hub v0.4.0" \
              --notes "Built-in Our Little Universe Family Relay. No VPN or home-router changes. The Windows PC keeps the master archive. One-time free relay hosting account setup happens on the PC. The relay passes updates and does not store a permanent media archive."
          fi

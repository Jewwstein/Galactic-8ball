name: Test Galactic Web Client
on:
  push:
    branches: [ "main" ]
    paths:
      - "server/**"
      - ".github/workflows/server-web.yml"
  workflow_dispatch:

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build server
        run: mvn -q -f server/pom.xml -DskipTests package
      - name: Launch server
        run: |
          PORT=10000 java -jar server/target/galactic-8ball-server-1.0.0.jar > /tmp/galactic-server.log 2>&1 &
          echo $! > /tmp/galactic-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:10000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/galactic-server.log
          exit 1
      - name: Verify web client
        run: |
          curl -fsS http://127.0.0.1:10000/health | grep -F "Galactic 8-Ball server OK"
          curl -fsS http://127.0.0.1:10000/play | grep -F "iPhone Web Test"
          curl -fsS http://127.0.0.1:10000/play/manifest.webmanifest | grep -F '"display": "standalone"'
          curl -fsS http://127.0.0.1:10000/play/icon.svg | grep -F "<svg"
      - name: Verify Render deployment
        run: |
          for i in {1..60}; do
            BODY="$(curl -fsS --max-time 20 https://galactic-8ball-server.onrender.com/play 2>/dev/null || true)"
            if echo "$BODY" | grep -Fq "iPhone Web Test"; then
              echo "Render web client is live."
              exit 0
            fi
            echo "Waiting for Render deployment ($i/60)..."
            sleep 5
          done
          echo "Render did not expose the new /play client within the verification window."
          exit 1
      - name: Show server log on failure
        if: failure()
        run: cat /tmp/galactic-server.log || true

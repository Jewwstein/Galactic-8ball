          python tools/extract_sabers.py
          python tools/extract_audio.py
          python tools/extract_fighters.py
          python tools/generate_hilt_materials.py
          mkdir -p app/src/main/assets/real_hilts
          cat model_assets/real_hilts_256.b64.part* | base64 -d > /tmp/real_hilts_256.zip
          unzip -q -o /tmp/real_hilts_256.zip -d app/src/main/assets/real_hilts
          gunzip -f app/src/main/assets/real_hilts/hilt_*.meshbin.gz
          cat model_assets/maul_hilt_slot3.b64.part* | base64 -d > /tmp/maul_hilt_slot3.zip
          unzip -q -o /tmp/maul_hilt_slot3.zip -d app/src/main/assets/real_hilts
          test -f app/src/main/assets/real_hilts/hilt_0.meshbin
          test -f app/src/main/assets/real_hilts/hilt_5.webp
          python tools/enhance_real_hilt_textures.py
          python tools/render_hilt_thumbnails.py
          rm -rf app/src/main/assets/sfx_bundle
          python -c 'from PIL import Image,ImageEnhance; from pathlib import Path; [(lambda p: (lambda im: ImageEnhance.Contrast(ImageEnhance.Sharpness(im).enhance(1.28)).enhance(1.06).save(p))(Image.open(p).convert("RGB")))(Path("app/src/main/assets/extracted")/n) for n in ["676837698804938946_Wood.png","-6450490125430097346_Felt.png"] if (Path("app/src/main/assets/extracted")/n).exists()]'
          python -c 'from PIL import Image; p="app/src/main/assets/environment/sky.jpg"; im=Image.open(p).convert("RGB"); im.thumbnail((2048,2048),Image.Resampling.LANCZOS); im.save(p,quality=91,optimize=True)'

          target_commitish: ${{ github.sha }}
          name: Galactic 8-Ball v0.7.1 Swipe Aim Test
          body: |
            Galactic 8-Ball Android multiplayer test build.
            Package: com.galactic.eightball
            Version: 0.7.1
            Source baseline: ${{ github.sha }}
            Adds full-screen one-finger swipe aiming: swipe left/right on open screen space to rotate the hilt and predictive line.
            Existing direct hilt dragging, precision aim buttons, two-finger pinch zoom, and two-finger camera pan remain available.
            Includes the Falcon render stability/depth fix and enhanced darker 2K Falcon texture.
            Preserves the approved Falcon footprint, current dogfight scale, physics, and multiplayer behavior.
          files: Galactic-8-Ball-v0.7.1-Swipe-Aim-Test.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

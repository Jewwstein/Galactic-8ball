      - name: Restore stable debug signing key
        run: base64 -d signing/galactic-stable-debug.keystore.b64 > app/galactic-stable-debug.keystore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Galactic-8-Ball-Full-Asset-Test
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare APK release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk Galactic-8-Ball-v0.7.1-Swipe-Aim-Test.apk
      - name: Publish GitHub Release

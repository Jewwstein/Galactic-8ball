          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/16030893891565470498/89B0CAD015E0A6DFCDDA81A9DB92D815F882D7E2/" -o app/src/main/assets/bundles/13_Jakku.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/11922640746717027681/3E7E3A685D08B8A6C454128DAEAA4F7422B133C8/" -o app/src/main/assets/bundles/14_Felucia.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/12102627026755944649/0BD5B4C1F88FBE2C3400E58960CA9D5F38C58E5A/" -o app/src/main/assets/bundles/15_Dathomir.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/18019963734976864613/033228830365C3C7DC6A809D52049D969D1BB303/" -o app/src/main/assets/bundles/00_DeathStar.unity3d
          curl -L --fail --retry 3 "https://steamusercontent-a.akamaihd.net/ugc/16592652791177328012/7952F99F19B694422DC410AB62236D57547DA00B/" -o app/src/main/assets/ui/hilt_default.png
          curl -L --fail --retry 3 "https://steamusercontent-a.akamaihd.net/ugc/11541815155918764269/E6731AB62A972F13292D9837D076FAAAD63AC39B/" -o app/src/main/assets/ui/hilt_2.png
          curl -L --fail --retry 3 "https://steamusercontent-a.akamaihd.net/ugc/14809402903243454095/B801B8DBEC9866F37728D3647692CCAC6C861AA6/" -o app/src/main/assets/ui/hilt_crystal.png
          curl -L --fail --retry 3 "https://steamusercontent-a.akamaihd.net/ugc/14166142156015969094/7917862EB5284157EAE59FB820F182EB61499BEF/" -o app/src/main/assets/ui/hilt_double.png
          curl -L --fail --retry 3 "https://steamusercontent-a.akamaihd.net/ugc/10217183308198287965/2B389B21625CF09D34618AC1847A1B0A4BBF6347/" -o app/src/main/assets/ui/hilt_classic.png
          curl -L --fail --retry 3 "https://steamusercontent-a.akamaihd.net/ugc/10227699883064345710/4F0530A979BF4B09A213D0439D0E3126E44B13A3/" -o app/src/main/assets/ui/hilt_weathered.png
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/15527668404159951881/323B6B0EA94462AEB74FBC00B01A55BBDAC16843/" -o app/src/main/assets/saber_bundles/red.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/18127488769931438563/BA3FB98F071BE232A1BFB215114C6C5E9B81BCF2/" -o app/src/main/assets/saber_bundles/blue.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/16766825368139937650/5807E93674C04B5088A8E0B53F5A3DAC8C0D8DD0/" -o app/src/main/assets/saber_bundles/purple.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/14390376776741791003/0E400BDD1622D11AE0ED0557155F75451AA2EC4B/" -o app/src/main/assets/saber_bundles/green.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/14596582609580564669/58B8AAE8B8B9C0A60ECE03E9CC1325E86498FBDD/" -o app/src/main/assets/saber_bundles/gold.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/16028108133931298657/01FC4DF2406F0763F471EF6C2AD1442E69723902/" -o app/src/main/assets/saber_bundles/white.unity3d
          curl -L --fail --retry 3 "https://steamusercontent-a.akamaihd.net/ugc/11276006983226989350/CFB4E42B430A20C3DC6AD3959B556C3BCC51A7DA/" -o app/src/main/assets/ui/blade_dark.png
          curl -L --fail --retry 3 "https://steamusercontent-a.akamaihd.net/ugc/15601371395550036893/2145580FC350A1815612550D4538C26D39DC7C85/" -o app/src/main/assets/ui/blade_gold.png
          curl -L --fail --retry 3 "https://steamusercontent-a.akamaihd.net/ugc/12320415776356535227/70C5F49BD2AC31F3FB7FAD572D434124A31AF9EE/" -o app/src/main/assets/ui/blade_purple.png
          curl -L --fail --retry 3 "https://steamusercontent-a.akamaihd.net/ugc/18413044388287686309/11ACF45720BA8B9BB48D2BDECFAD744CC9840FAB/" -o app/src/main/assets/ui/blade_green.png
          curl -L --fail --retry 3 "https://steamusercontent-a.akamaihd.net/ugc/9494571780957515383/6C134CAF718A941D2B536CA1152CBE86EF2AE0A0/" -o app/src/main/assets/ui/blade_red.png
          curl -L --fail --retry 3 "https://steamusercontent-a.akamaihd.net/ugc/12253231560154659811/C5D4EE438F43ED139FCA39C5BC653143187A71E6/" -o app/src/main/assets/ui/blade_blue.png
          file app/src/main/assets/ui/*
          test "$(head -c 7 app/src/main/assets/galactic_table.unity3d)" = "UnityFS"
          python -m pip install -q UnityPy Pillow
          python tools/extract_unity.py
          python tools/extract_balls.py
          python tools/extract_sabers.py
          sha256sum app/src/main/assets/galactic_table.unity3d app/src/main/assets/bundles/*.unity3d
      - uses: actions/upload-artifact@v4
        with:
          name: Galactic-Extracted-All-Debug
          path: |
            app/src/main/assets/extracted
            app/src/main/assets/objects
            app/src/main/assets/sabers
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Galactic-8-Ball-Full-Asset-Test
          path: app/build/outputs/apk/debug/app-debug.apk

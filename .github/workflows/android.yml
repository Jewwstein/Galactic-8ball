name: Build Galactic 8-Ball APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch original Galactic table, planets, and Death Star
        run: |
          mkdir -p app/src/main/assets/extracted app/src/main/assets/bundles
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/9481049145480738435/79C9D5534EE116AADE73A4333A9F46ADB58648EE/" -o app/src/main/assets/galactic_table.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/17620175737392888259/B4D4189372EB896223A54B115BDBF9CBCF93F132/" -o app/src/main/assets/bundles/01_Tatooine.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/14726310821852080752/5B54F595EDB4BBEEF6FC3B3CF12E477BB4560E80/" -o app/src/main/assets/bundles/02_Kamino.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/15879369231482719879/199BF27B1185405D25BBEBEE9257F81E945F9B6D/" -o app/src/main/assets/bundles/03_Mustafar.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/14718098737190180358/34B49A25B63E61C3148E001086BF0EB598E204FC/" -o app/src/main/assets/bundles/04_Coruscant.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/17665742400197609247/419FEB448B808A0CF9B4E17D19B27FCE32CB8286/" -o app/src/main/assets/bundles/05_Geonosis.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/14880608518692260043/3B44B6807614D2185F4C07BF071D4E94C8D1785D/" -o app/src/main/assets/bundles/06_Endor.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/16993867354122895066/4A9EFC07FB3C3E7D7597DE352F126389841061F9/" -o app/src/main/assets/bundles/07_Korriban.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/9403609087667725004/CA06238A29E6CD582E8D362834DA3613A44C9FDF/" -o app/src/main/assets/bundles/08_Exegol.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/14305048939786586138/9AB41D75130ABDA43FB210EC4DDD7DCD60C37D5F/" -o app/src/main/assets/bundles/09_Yavin.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/13603990644295211631/A6B35F17390A857E1838AB2A5C152ED69E4DC022/" -o app/src/main/assets/bundles/10_Bespin.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/9942602938829926534/670762419B92366CE6AFECD0D67E168FE838153B/" -o app/src/main/assets/bundles/11_Malastare.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/16121601629413341859/E8F9473CD6EFE79D3072E8BD0A2F285ECF225DA2/" -o app/src/main/assets/bundles/12_Kessel.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/16030893891565470498/89B0CAD015E0A6DFCDDA81A9DB92D815F882D7E2/" -o app/src/main/assets/bundles/13_Jakku.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/11922640746717027681/3E7E3A685D08B8A6C454128DAEAA4F7422B133C8/" -o app/src/main/assets/bundles/14_Felucia.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/12102627026755944649/0BD5B4C1F88FBE2C3400E58960CA9D5F38C58E5A/" -o app/src/main/assets/bundles/15_Dathomir.unity3d
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/18019963734976864613/033228830365C3C7DC6A809D52049D969D1BB303/" -o app/src/main/assets/bundles/00_DeathStar.unity3d
          test "$(head -c 7 app/src/main/assets/galactic_table.unity3d)" = "UnityFS"
          python -m pip install -q UnityPy Pillow
          python tools/extract_unity.py
          python tools/extract_balls.py
          sha256sum app/src/main/assets/galactic_table.unity3d app/src/main/assets/bundles/*.unity3d
      - uses: actions/upload-artifact@v4
        with:
          name: Galactic-Extracted-All-Debug
          path: |
            app/src/main/assets/extracted
            app/src/main/assets/objects
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Galactic-8-Ball-Full-Asset-Test
          path: app/build/outputs/apk/debug/app-debug.apk

name: Build Galactic 8-Ball APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch original Galactic Unity table bundle
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/12707506843866704649/88B0FF640B639E479D43D04957146C9CA95D3224/" -o app/src/main/assets/galactic_table.unity3d
          test "$(head -c 7 app/src/main/assets/galactic_table.unity3d)" = "UnityFS"
          ls -lh app/src/main/assets/galactic_table.unity3d
      - name: Extract original Unity assets\n        run: |\n          python -m pip install -q UnityPy Pillow\n          python tools/extract_unity.py\n          ls -lh app/src/main/assets/extracted || true\n      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Galactic-8-Ball-Embedded-Real-Asset
          path: app/build/outputs/apk/debug/app-debug.apk

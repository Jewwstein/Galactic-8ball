name: Build Galactic 8-Ball APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch and extract accepted v53 Galactic table
        run: |
          mkdir -p app/src/main/assets/extracted
          curl -L --fail --retry 3 -A "Mozilla/5.0" "https://steamusercontent-a.akamaihd.net/ugc/9481049145480738435/79C9D5534EE116AADE73A4333A9F46ADB58648EE/" -o app/src/main/assets/galactic_table.unity3d
          test "$(head -c 7 app/src/main/assets/galactic_table.unity3d)" = "UnityFS"
          sha256sum app/src/main/assets/galactic_table.unity3d
          python -m pip install -q UnityPy Pillow
          python tools/extract_unity.py
          find app/src/main/assets/extracted -maxdepth 1 -type f -printf '%f %s bytes\n' | head -80
      - uses: actions/upload-artifact@v4
        with:
          name: Galactic-Extracted-Table-Debug
          path: app/src/main/assets/extracted
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Galactic-8-Ball-Real-Table-Render-Test
          path: app/build/outputs/apk/debug/app-debug.apk

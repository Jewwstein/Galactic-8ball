name: Build Our Little Universe Android APK
on:
  push:
    branches: [little-universe-v1]
    paths:
      - 'little-universe/**'
      - '.github/workflows/build-little-universe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install required Android 35 SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build installable Android APK
        run: gradle -p little-universe :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK exists
        run: |
          ls -lh little-universe/app/build/outputs/apk/debug/app-debug.apk
          unzip -l little-universe/app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes.dex|AndroidManifest.xml'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Little-Universe-Android-v0.5.2
          path: little-universe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish permanent APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="little-universe-v0.5.2"
          APK="little-universe/app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#Little-Universe-v0.5.2.apk" --clobber
          else
            gh release create "$TAG" "$APK#Little-Universe-v0.5.2.apk" --target "$GITHUB_SHA" --title "Our Little Universe v0.5.2 • Android" --notes "Our Little Universe v0.5.2 adds original-quality Save to Phone and Choose Folder in photo, video and voice-recording viewers. On modern Android copies directly into Pictures, Movies or Music under Our Little Universe. Existing design, memory features, private ZIP and family ZIP merge preserved, with separate app ID to protect prior prototype data."
          fi

name: Our Little Universe Family Sync Web and Windows
on:
  push:
    branches: [little-universe-v1]
    paths:
      - 'our-little-universe-desktop/**'
      - '.github/workflows/our-little-universe-cross-platform.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    name: Build and test installable web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: our-little-universe-desktop
        run: npm install --no-audit --no-fund
      - name: Run archive format smoke tests
        working-directory: our-little-universe-desktop
        run: npm test
      - name: Build browser PWA
        working-directory: our-little-universe-desktop
        run: npm run build
      - name: Upload standalone web files
        uses: actions/upload-artifact@v4
        with:
          name: Our-Little-Universe-FamilySync-Web-PWA
          path: our-little-universe-desktop/dist/
          retention-days: 90
      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: our-little-universe-desktop/dist/
  publish-web:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: our-little-universe-site
    steps:
      - name: Publish browser PWA to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
  windows:
    name: Build Windows portable EXE
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: our-little-universe-desktop
        run: npm install --no-audit --no-fund
      - name: Build browser application
        working-directory: our-little-universe-desktop
        run: npm run build
      - name: Package Windows portable executable
        working-directory: our-little-universe-desktop
        run: npx electron-builder --win portable --x64 --publish never
      - name: Verify executable exists
        shell: pwsh
        run: |
          Get-ChildItem our-little-universe-desktop/release/*.exe | Select-Object Name,Length
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Our-Little-Universe-FamilyRelay-Windows-Portable
          path: our-little-universe-desktop/release/*.exe
          retention-days: 90
      - name: Publish permanent Windows EXE download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="our-little-universe-windows-v0.4.0"
          EXE="our-little-universe-desktop/release/Our-Little-Universe-Windows-v0.4.0-FamilyRelay-Portable.exe"
          test -f "$EXE"
          sha256sum "$EXE"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$EXE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$EXE" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Our Little Universe Windows v0.4.0" \
              --notes "Family Relay built into our Windows app. No VPN or router configuration. Your PC stores family originals. One-time free relay hosting account setup required on owner PC only."
          fi

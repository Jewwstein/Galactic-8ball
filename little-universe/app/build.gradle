plugins { id 'com.android.application' }
android {
    namespace 'com.littleuniverse.memories'
    compileSdk 35
    defaultConfig {
        applicationId 'com.littleuniverse.memories.depth'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

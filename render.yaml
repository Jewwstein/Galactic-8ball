services:
  - type: web
    name: galactic-8ball-server
    runtime: docker
    rootDir: server
    region: virginia
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

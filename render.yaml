services:
  - type: web
    name: galactic-8ball-server
    runtime: docker
    rootDir: server
    region: virginia
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: galactic-accounts
      mountPath: /var/data
      sizeGB: 1
